# DILGR8RSP - nginx site config for the single-EC2-instance deployment.
# Installed by setup.sh to /etc/nginx/sites-available/dilgr8rsp and symlinked
# into sites-enabled. Serves the built frontend as static files and proxies
# /api to the Node backend (systemd service, listening on 127.0.0.1:4000 -
# never exposed directly, see README.md's security group notes).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/dilgr8rsp/frontend/dist;
    index index.html;

    # Matches backend/.env's MAX_UPLOAD_SIZE_BYTES (5MB) plus headroom for
    # multipart overhead - keep these two in sync if either changes.
    client_max_body_size 8m;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback - any path that isn't a real static file (e.g. a deep
    # link like /admin/dashboard on a fresh page load) serves index.html so
    # react-router can take over client-side, matching how the Vite dev
    # server already behaves.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
